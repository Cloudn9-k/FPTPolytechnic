<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý Sinh viên</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container p-4">
<h2 class="mb-4">Quản lý Sinh Viên</h2>
<div class="row mb-3">
  <div class="col-md-4">
    <input type="text" id="key" class="form-control" placeholder="Key (Firebase ID)" readonly>
  </div>
  <div class="col-md-4">
    <input type="text" id="id" class="form-control" placeholder="Mã SV">
  </div>
  <div class="col-md-4">
    <input type="text" id="name" class="form-control" placeholder="Họ và Tên">
  </div>
</div>
<div class="mb-3">
  <button onclick="addStudent()" class="btn btn-primary">Thêm (POST)</button>
  <button onclick="updateStudent()" class="btn btn-warning">Sửa (PUT)</button>
  <button onclick="deleteStudent()" class="btn btn-danger">Xóa (DELETE)</button>
  <button onclick="resetForm()" class="btn btn-secondary">Làm mới</button>
</div>

<table class="table table-bordered">
  <thead><tr><th>Key</th><th>Mã SV</th><th>Họ Tên</th><th>Chọn</th></tr></thead>
  <tbody id="tableBody"></tbody>
</table>

<script>
  const API = "http://localhost:8080/api/student";

  // Hàm load dữ liệu (GET)
  function loadData() {
    fetch(API)
            .then(res => res.json())
            .then(data => {
              let html = "";
              // Duyệt qua Map trả về
              for (let key in data) {
                let sv = data[key];
                html += `<tr>
                                    <td>${key}</td>
                                    <td>${sv.id}</td>
                                    <td>${sv.name}</td>
                                    <td><button class="btn btn-sm btn-info" onclick="selectStudent('${key}', '${sv.id}', '${sv.name}')">Chọn</button></td>
                                 </tr>`;
              }
              document.getElementById("tableBody").innerHTML = html;
            });
  }

  // Hàm thêm (POST)
  function addStudent() {
    let data = { id: document.getElementById("id").value, name: document.getElementById("name").value };
    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(() => { alert("Đã thêm!"); loadData(); resetForm(); });
  }

  // Hàm sửa (PUT)
  function updateStudent() {
    let key = document.getElementById("key").value;
    let data = { id: document.getElementById("id").value, name: document.getElementById("name").value };
    fetch(API + "/" + key, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    }).then(() => { alert("Đã sửa!"); loadData(); resetForm(); });
  }

  // Hàm xóa (DELETE)
  function deleteStudent() {
    let key = document.getElementById("key").value;
    fetch(API + "/" + key, { method: "DELETE" })
            .then(() => { alert("Đã xóa!"); loadData(); resetForm(); });
  }

  function selectStudent(key, id, name) {
    document.getElementById("key").value = key;
    document.getElementById("id").value = id;
    document.getElementById("name").value = name;
  }
  function resetForm() {
    document.getElementById("key").value = "";
    document.getElementById("id").value = "";
    document.getElementById("name").value = "";
  }
  loadData(); // Gọi hàm load khi chạy trang
</script>
</body>
</html>
