<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container my-5">
  <div class="card shadow-sm" style="max-width: 500px; margin: auto;">

    <div th:if="${param.logout}" class="alert alert-success">
      Đã đăng xuất thành công!
    </div>
    <div th:if="${param.error}" class="alert alert-danger">
      Sai tài khoản hoặc mật khẩu!
    </div>

    <div class="card-header alert alert-info" th:text="${message}">Vui lòng đăng nhập</div>
    <div class="card shadow-lg p-4">

      <form action="/auth/check" method="post">
        <h4>Đăng nhập hệ thống</h4>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input class="form-control" id="username" name="username" placeholder="admin@gmail.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" name="remember-me" id="remember-me">
          <label class="form-check-label" for="remember-me">Remember Me?</label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <hr class="my-3">

      <div class="text-center">
        <p>Hoặc đăng nhập bằng Google</p>
        <a href="/oauth2/authorization/google" class="btn btn-danger w-100">
          Google
        </a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
